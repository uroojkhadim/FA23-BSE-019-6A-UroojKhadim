<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List - CRUD App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; cursor: pointer; border: none; font-size: 14px; }
        .btn-add { background-color: #28a745; color: white; margin-bottom: 20px; display: inline-block; }
        .btn-view { background-color: #17a2b8; color: white; margin-right: 5px; }
        .btn-edit { background-color: #ffc107; color: black; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <h1>User List</h1>
    <a href="/create" class="btn btn-add">Add New User</a>
    
    <table id="userTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userBody">
            <!-- Data will be loaded here via JS -->
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userBody = document.getElementById('userBody');
            
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                
                if (users.length === 0) {
                    userBody.innerHTML = '<tr><td colspan="4">No users found.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.age}</td>
                        <td>
                            <a href="/view/${user._id}" class="btn btn-view">View</a>
                            <a href="/edit/${user._id}" class="btn btn-edit">Edit</a>
                            <button onclick="deleteUser('${user._id}')" class="btn btn-delete">Delete</button>
                        </td>
                    `;
                    userBody.appendChild(row);
                });
            } catch (err) {
                console.error('Error fetching users:', err);
            }
        });

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    const response = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Error deleting user');
                    }
                } catch (err) {
                    console.error('Error:', err);
                }
            }
        }
    </script>
</body>
</html>
